<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Patternly · A small pattern, better sleep</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header class="workspace-header">
      <span class="brand">Patternly</span
      ><button id="account-logout" data-action="logout" hidden>Sign out</button>
    </header>
    <main class="workspace">
      <aside class="intro">
        <p class="eyebrow">A LITTLE EVERY DAY</p>
        <h1>Better sleep starts <br />with a small pattern.</h1>
        <nav id="steps" aria-label="App stages"></nav>
      </aside>
      <section class="phone" aria-label="Patternly application">
        <header class="phone-header">
          <span class="brand">Patternly</span
          ><button id="menu" class="icon" aria-label="Open navigation menu">
            <img src="/assets/menu.svg" alt="" />
          </button>
        </header>
        <div id="screen"></div>
      </section>
      <aside id="database" class="database" hidden>
        <p class="eyebrow">ADMIN DATA</p>
        <h2>Account data</h2>
        <p>Saved entries across accounts.</p>
        <div class="row">
          <button id="refresh">Refresh</button
          ><button id="export">Export JSON</button>
        </div>
        <div id="tables"></div>
      </aside>
    </main>
    <dialog id="popup" aria-labelledby="popup-title">
      <div id="popup-content"></div>
      <button id="close-popup" class="text-button">Close</button>
    </dialog>
    <div id="status" role="status" aria-live="polite"></div>
  </body>
</html>
